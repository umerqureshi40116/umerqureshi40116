<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Let's build something">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".12" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#6366f1" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <mask id="mfade"><rect width="1200" height="160" fill="url(#fadeX)"/></mask>
    <mask id="mdown"><rect width="1200" height="160" fill="url(#fadeY)"/></mask>
    <clipPath id="card"><rect width="1200" height="160"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>

  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .glow{animation:drift 16s ease-in-out infinite alternate}
    .caret{animation:blink 1.1s steps(1) infinite}
    @keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.glow,.caret{animation:none}}
  </style>

  <rect width="1200" height="160" fill="#05060c"/>
  <rect width="1200" height="3" fill="url(#accent)" mask="url(#mfade)"/>

  <g clip-path="url(#card)">
    <g mask="url(#mfade)"><g mask="url(#mdown)"><rect width="1200" height="160" fill="url(#grid)"/></g></g>
    <g filter="url(#soft)" opacity=".38">
      <circle class="glow" cx="600" cy="150" r="110" fill="#6366f1"/>
    </g>
    <text class="mono" x="600" y="86" font-size="17" text-anchor="middle" letter-spacing="1.2" fill="#c7cede">
      <tspan fill="#7a8299">$</tspan> let's build something that ships<tspan class="caret" fill="#38bdf8">▍</tspan>
    </text>
    <text class="mono" x="600" y="116" font-size="12.5" text-anchor="middle" letter-spacing="3" fill="#7a8299">ISLAMABAD, PAKISTAN</text>
  </g>
</svg>
