<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Let's build something that ships. Islamabad, Pakistan.">
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc" stop-opacity=".10"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<linearGradient id="fx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".05" stop-color="#fff" stop-opacity="1"/><stop offset=".95" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="mx"><rect width="1200" height="170" fill="url(#fx)"/></mask>
<pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(0 -8)"><path d="M56 0H0v56" fill="none" stroke="#6366f1" stroke-opacity=".075" stroke-width="1"/></pattern>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
</defs>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.caret{animation:blink 1.1s steps(1) infinite}
.g{animation:g 18s ease-in-out infinite alternate}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes g{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
@media (prefers-reduced-motion:reduce){.caret,.g{animation:none}}
</style>
<rect width="1200" height="170" fill="#05060c"/><g mask="url(#mx)"><rect width="1200" height="170" fill="url(#grid)"/></g><rect x="36" y="0" width="1" height="170" fill="#161b2f"/>
<g filter="url(#soft)" opacity=".3"><circle class="g" cx="600" cy="180" r="110" fill="#6366f1"/></g>
<text class="mono" x="72" y="80" font-size="16" letter-spacing="1" fill="#c7cede"><tspan fill="#7a8299">$</tspan> let's build something that ships<tspan class="caret" fill="#38bdf8">&#9613;</tspan></text>
<text class="mono" x="72" y="112" font-size="11.5" letter-spacing="2.4" fill="#7a8299">ISLAMABAD, PAKISTAN</text>
<text class="mono" x="1128" y="80" font-size="11.5" letter-spacing="2" text-anchor="end" fill="#7a8299">UMER QURESHI</text>
<rect x="72" y="140" width="1056" height="2" rx="1" fill="url(#acc)" mask="url(#mx)"/>
</svg>
