<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="600" height="170" role="img" aria-label="Brain Tumor Detection - Deep learning for medical image analysis.">
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0v56" fill="none" stroke="#6366f1" stroke-opacity=".09" stroke-width="1"/></pattern><linearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc" stop-opacity=".13"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<clipPath id="cc"><rect x="6" y="6" width="588" height="158" rx="14"/></clipPath>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.sweep{animation:sweep 6s ease-in-out infinite;animation-delay:0.9s}
.nudge{animation:nudge 2.4s ease-in-out infinite;animation-delay:0.9s}
.orb{animation:orb 13s ease-in-out infinite alternate}
@keyframes sweep{0%{transform:translateX(-260px)}55%,100%{transform:translateX(640px)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@keyframes orb{from{transform:translate(0,0)}to{transform:translate(-40px,18px)}}
@media (prefers-reduced-motion:reduce){.sweep,.nudge,.orb{animation:none}}
</style>
<rect width="600" height="170" fill="#05060c"/>
<rect x="6" y="6" width="588" height="158" rx="14" fill="#0a0d1a" stroke="#1e2439"/>
<g clip-path="url(#cc)">
  <rect x="6" y="6" width="588" height="158" fill="url(#grid)" opacity=".55"/>
  <g filter="url(#soft)" opacity=".30"><circle class="orb" cx="530" cy="26" r="62" fill="#6366f1"/></g>
  <g class="sweep"><rect x="-220" y="-60" width="220" height="300" fill="url(#shim)" transform="skewX(-22)"/></g>
</g>
<text class="mono" x="30" y="42" font-size="11" letter-spacing="1.6" fill="#38bdf8">03</text>
<text class="sans" x="30" y="76" font-size="20" font-weight="700" letter-spacing="-.2" fill="#f4f6fb">Brain Tumor Detection</text>
<text class="sans" x="30" y="102" font-size="13.5" fill="#7a8299">Deep learning for medical image analysis.</text>
<rect x="30" y="121" width="146" height="26" rx="13" fill="#101426" stroke="#1e2439"/>
<circle cx="45" cy="134" r="3.5" fill="#ff6f00"/>
<text class="mono" x="56" y="138" font-size="11.5" letter-spacing=".8" fill="#c7cede">Deep Learning</text>
<g class="nudge"><text class="mono" x="481" y="138" font-size="11.5" letter-spacing="1.2" fill="#38bdf8">VIEW REPO &#8594;</text></g>
</svg>
