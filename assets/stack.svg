<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 100" width="1200" height="100" role="img" aria-label="Tech stack: Python, JavaScript, HTML5, CSS3, Jupyter, Git, GitHub">
  <defs>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".08" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".92" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mfade"><rect width="1200" height="100" fill="url(#fadeX)"/></mask>

    <g id="set">
      <rect x="0" y="30" width="102" height="40" rx="20" fill="#101426" stroke="#1e2439"/>
      <circle cx="18" cy="50" r="4" fill="#4b8bbe"/>
      <text class="mono" x="32" y="55" font-size="13" letter-spacing=".6" fill="#c7cede">Python</text>

      <rect x="120" y="30" width="136" height="40" rx="20" fill="#101426" stroke="#1e2439"/>
      <circle cx="138" cy="50" r="4" fill="#f7df1e"/>
      <text class="mono" x="152" y="55" font-size="13" letter-spacing=".6" fill="#c7cede">JavaScript</text>

      <rect x="274" y="30" width="94" height="40" rx="20" fill="#101426" stroke="#1e2439"/>
      <circle cx="292" cy="50" r="4" fill="#e34f26"/>
      <text class="mono" x="306" y="55" font-size="13" letter-spacing=".6" fill="#c7cede">HTML5</text>

      <rect x="386" y="30" width="86" height="40" rx="20" fill="#101426" stroke="#1e2439"/>
      <circle cx="404" cy="50" r="4" fill="#38bdf8"/>
      <text class="mono" x="418" y="55" font-size="13" letter-spacing=".6" fill="#c7cede">CSS3</text>

      <rect x="490" y="30" width="111" height="40" rx="20" fill="#101426" stroke="#1e2439"/>
      <circle cx="508" cy="50" r="4" fill="#f37626"/>
      <text class="mono" x="522" y="55" font-size="13" letter-spacing=".6" fill="#c7cede">Jupyter</text>

      <rect x="619" y="30" width="77" height="40" rx="20" fill="#101426" stroke="#1e2439"/>
      <circle cx="637" cy="50" r="4" fill="#f05032"/>
      <text class="mono" x="651" y="55" font-size="13" letter-spacing=".6" fill="#c7cede">Git</text>

      <rect x="714" y="30" width="102" height="40" rx="20" fill="#101426" stroke="#1e2439"/>
      <circle cx="732" cy="50" r="4" fill="#f4f6fb"/>
      <text class="mono" x="746" y="55" font-size="13" letter-spacing=".6" fill="#c7cede">GitHub</text>
    </g>
  </defs>

  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .track{animation:march 26s linear infinite}
    @keyframes march{from{transform:translateX(0)}to{transform:translateX(-834px)}}
    @media (prefers-reduced-motion:reduce){.track{animation:none}}
  </style>

  <rect width="1200" height="100" fill="#05060c"/>
  <g mask="url(#mfade)">
    <g class="track">
      <use href="#set" xlink:href="#set"/>
      <use href="#set" xlink:href="#set" x="834"/>
      <use href="#set" xlink:href="#set" x="1668"/>
    </g>
  </g>
</svg>
