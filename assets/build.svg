<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="What I build. Web: responsive, fast, modern websites and full-stack applications for businesses and academies. AI and ML: deep learning and prediction models for healthcare, computer vision and AI-powered apps. Automation: Python scripts and workflows that remove repetitive work and connect your tools.">
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc" stop-opacity=".10"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<linearGradient id="fx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".05" stop-color="#fff" stop-opacity="1"/><stop offset=".95" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="mx"><rect width="1200" height="300" fill="url(#fx)"/></mask>
<pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(0 -52)"><path d="M56 0H0v56" fill="none" stroke="#6366f1" stroke-opacity=".075" stroke-width="1"/></pattern>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
</defs>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.float{animation:float 5s ease-in-out infinite alternate}
.spin{animation:spin 16s linear infinite;transform-box:fill-box;transform-origin:center}
.blip{animation:blip 3s ease-in-out infinite}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.float,.spin,.blip{animation:none}}
</style>
