<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 272" width="1200" height="272" role="img" aria-label="About. Umer Qureshi is a developer building web, AI and automation solutions. He designs and ships client websites, full-stack apps and machine-learning projects, from idea to deployment. Location Islamabad, Pakistan. Education NUTECH, class of 2025. Studio Codematically. Status open to freelance and collaborations.">
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc" stop-opacity=".10"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<linearGradient id="fx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".05" stop-color="#fff" stop-opacity="1"/><stop offset=".95" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="mx"><rect width="1200" height="272" fill="url(#fx)"/></mask>
<pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(0 -4)"><path d="M56 0H0v56" fill="none" stroke="#6366f1" stroke-opacity=".075" stroke-width="1"/></pattern>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
</defs>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.sweep{animation:sweep 8s ease-in-out infinite}
.g{animation:g 17s ease-in-out infinite alternate}
.live{animation:blink 2.4s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-360px)}60%,100%{transform:translateX(1500px)}}
@keyframes g{from{transform:translate(0,0)}to{transform:translate(70px,-24px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sweep,.g,.live{animation:none}}
</style>
<rect width="1200" height="272" fill="#05060c"/><g mask="url(#mx)"><rect width="1200" height="272" fill="url(#grid)"/></g><rect x="36" y="0" width="1" height="272" fill="#161b2f"/>
<g filter="url(#soft)" opacity=".22"><circle class="g" cx="170" cy="250" r="95" fill="#38bdf8"/></g>
<circle cx="36.5" cy="52" r="3.5" fill="#38bdf8"/><text class="mono" x="72" y="56" font-size="11.5" letter-spacing="1.6" fill="#38bdf8">01</text><text class="sans" x="106" y="56" font-size="13" font-weight="700" letter-spacing="2.6" fill="#c7cede">ABOUT</text>
<text class="sans" x="72" y="126" font-size="26" font-weight="600" letter-spacing="-.3" fill="#f4f6fb">Hi, I'm Umer Qureshi &#8212; a developer building</text>
<text class="sans" x="72" y="162" font-size="26" font-weight="600" letter-spacing="-.3" fill="#f4f6fb">web, AI and automation solutions.</text>
<text class="sans" x="72" y="206" font-size="14.5" fill="#7a8299">I design and ship client websites, full-stack apps and</text>
<text class="sans" x="72" y="230" font-size="14.5" fill="#7a8299">machine-learning projects, from idea to deployment.</text>

<text class="mono" x="784" y="112" font-size="10.5" letter-spacing="1.8" fill="#7a8299">LOCATION</text>
<text class="mono" x="1128" y="112" font-size="13" text-anchor="end" fill="#c7cede">Islamabad, Pakistan</text>
<rect x="784" y="128" width="344" height="1" fill="#161b2f"/>

<text class="mono" x="784" y="154" font-size="10.5" letter-spacing="1.8" fill="#7a8299">EDUCATION</text>
<text class="mono" x="1128" y="154" font-size="13" text-anchor="end" fill="#c7cede">NUTECH — Class of 2025</text>
<rect x="784" y="170" width="344" height="1" fill="#161b2f"/>

<text class="mono" x="784" y="196" font-size="10.5" letter-spacing="1.8" fill="#7a8299">STUDIO</text>
<text class="mono" x="1128" y="196" font-size="13" text-anchor="end" fill="#c7cede">Codematically</text>
<rect x="784" y="212" width="344" height="1" fill="#161b2f"/>
<circle class="live" cx="784" cy="234" r="3" fill="#38bdf8"/>
<text class="mono" x="796" y="238" font-size="10.5" letter-spacing="1.8" fill="#7a8299">STATUS</text>
<text class="mono" x="1128" y="238" font-size="13" text-anchor="end" fill="#c7cede">Open to freelance &amp; collabs</text>
<rect x="784" y="254" width="344" height="1" fill="#161b2f"/>
<g mask="url(#mx)"><g class="sweep"><rect x="-300" y="-80" width="300" height="440" fill="url(#shim)" transform="skewX(-22)"/></g></g>
</svg>
