<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 725" width="1200" height="725" role="img" aria-label="Process — discover, design and plan, build, launch and automate."><defs><linearGradient id="cn"><stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/><stop offset="1" stop-color="#1e2439"/></linearGradient></defs><style>@font-face{font-family:'Inter';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif}@keyframes step{0%,100%{fill:rgba(122,130,153,.4)}6%,22%{fill:#38bdf8}28%{fill:rgba(122,130,153,.4)}}.step{animation:step 10s ease-in-out infinite;fill:rgba(122,130,153,.4)}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="725" fill="#070911"/><rect x="0" y="0" width="1200" height="1" fill="#1e2439"/><text x="56.0" y="158.0" font-size="15.6" font-weight="500" fill="#38bdf8" letter-spacing="0.78">PROCESS</text><text x="56.0" y="224.0" font-size="46.8" font-weight="600" fill="#f4f6fb" letter-spacing="-1.17">A simple, transparent way of working</text><text x="56.0" y="277.2" font-size="20.8" font-weight="400" fill="#7a8299">No black boxes. You know what&#x27;s happening at every stage, from first call to launch day.</text><text class="step" style="animation-delay:0.0s" x="56.0" y="389.2" font-size="31.2" font-weight="600">01</text><rect x="105.4" y="378.2" width="217.4" height="1.3" fill="url(#cn)"/><text x="56.0" y="441.6" font-size="23.4" font-weight="500" fill="#f4f6fb">Discover</text><text x="56.0" y="481.0" font-size="18.2" font-weight="400" fill="#7a8299">A short call to understand</text><text x="56.0" y="510.6" font-size="18.2" font-weight="400" fill="#7a8299">your goals, workflows, and</text><text x="56.0" y="540.2" font-size="18.2" font-weight="400" fill="#7a8299">where time or revenue is</text><text x="56.0" y="569.8" font-size="18.2" font-weight="400" fill="#7a8299">leaking.</text><text class="step" style="animation-delay:2.5s" x="338.4" y="389.2" font-size="31.2" font-weight="600">02</text><rect x="394.0" y="378.2" width="211.2" height="1.3" fill="url(#cn)"/><text x="338.4" y="441.6" font-size="23.4" font-weight="500" fill="#f4f6fb">Design &amp; Plan</text><text x="338.4" y="481.0" font-size="18.2" font-weight="400" fill="#7a8299">You get a clear scope,</text><text x="338.4" y="510.6" font-size="18.2" font-weight="400" fill="#7a8299">timeline, and a design</text><text x="338.4" y="540.2" font-size="18.2" font-weight="400" fill="#7a8299">direction before a single</text><text x="338.4" y="569.8" font-size="18.2" font-weight="400" fill="#7a8299">line of code is written.</text><text class="step" style="animation-delay:5.0s" x="620.8" y="389.2" font-size="31.2" font-weight="600">03</text><rect x="676.8" y="378.2" width="210.8" height="1.3" fill="url(#cn)"/><text x="620.8" y="441.6" font-size="23.4" font-weight="500" fill="#f4f6fb">Build</text><text x="620.8" y="481.0" font-size="18.2" font-weight="400" fill="#7a8299">Built in the open — regular</text><text x="620.8" y="510.6" font-size="18.2" font-weight="400" fill="#7a8299">check-ins and a staging</text><text x="620.8" y="540.2" font-size="18.2" font-weight="400" fill="#7a8299">link so you can watch it</text><text x="620.8" y="569.8" font-size="18.2" font-weight="400" fill="#7a8299">take shape.</text><text class="step" style="animation-delay:7.5s" x="903.2" y="389.2" font-size="31.2" font-weight="600">04</text><text x="903.2" y="441.6" font-size="23.4" font-weight="500" fill="#f4f6fb">Launch &amp; Automate</text><text x="903.2" y="481.0" font-size="18.2" font-weight="400" fill="#7a8299">Shipped to production, with</text><text x="903.2" y="510.6" font-size="18.2" font-weight="400" fill="#7a8299">the automations wired up</text><text x="903.2" y="540.2" font-size="18.2" font-weight="400" fill="#7a8299">that keep things running</text><text x="903.2" y="569.8" font-size="18.2" font-weight="400" fill="#7a8299">without manual upkeep.</text></svg>