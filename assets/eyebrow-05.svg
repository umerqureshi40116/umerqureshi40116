<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Github Stats">
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="rf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="rm"><rect x="235" y="0" width="964" height="64" fill="url(#rf)"/></mask>
<filter id="dg" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.run{animation:run 9s ease-in-out infinite alternate}
@keyframes run{from{transform:translateX(235px)}to{transform:translateX(1176px)}}
@media (prefers-reduced-motion:reduce){.run{animation:none}}
</style>
<rect width="1200" height="64" fill="#05060c"/>
<rect x="0" y="22" width="3" height="21" rx="1.5" fill="url(#acc)"/>
<text class="mono" x="18" y="38" font-size="12" letter-spacing="1.4" fill="#38bdf8">05</text>
<text class="sans" x="52" y="39" font-size="20" font-weight="800" letter-spacing="1.6" fill="#f4f6fb">GITHUB STATS</text>
<g mask="url(#rm)"><rect x="235" y="31" width="964" height="1" fill="#1e2439"/></g>
<g class="run"><circle cx="0" cy="31.5" r="2.6" fill="#38bdf8" filter="url(#dg)"/><circle cx="0" cy="31.5" r="1.4" fill="#e0f2fe"/></g>
</svg>
