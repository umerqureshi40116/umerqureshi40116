<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 72" width="400" height="72" role="img" aria-label="LinkedIn profile">
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc" stop-opacity=".13"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<clipPath id="pc"><rect x="6" y="6" width="388" height="60" rx="30"/></clipPath>
</defs>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.sweep{animation:sweep 5.5s ease-in-out infinite}
.nudge{animation:nudge 2.2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-200px)}60%,100%{transform:translateX(440px)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.sweep,.nudge{animation:none}}
</style>
<rect width="400" height="72" fill="#05060c"/>
<rect x="6" y="6" width="388" height="60" rx="30" fill="#0a0d1a" stroke="#1e2439"/>
<g clip-path="url(#pc)"><g class="sweep"><rect x="-180" y="-40" width="180" height="180" fill="url(#shim)" transform="skewX(-22)"/></g></g>
<circle cx="46" cy="36" r="19" fill="#101426" stroke="#1e2439"/>
<g transform="translate(46 36)" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-8.5-3v11"/><circle cx="-8.5" cy="-7" r="1.4" fill="#6366f1" stroke="none"/><path d="M-2-3v11M-2 1.5a4.5 4.5 0 019 0V8"/></g>
<text class="mono" x="84" y="41" font-size="14" letter-spacing="1.4" fill="#f4f6fb">LINKEDIN</text>
<g class="nudge"><text class="mono" x="354" y="41" font-size="14" fill="#38bdf8">&#8594;</text></g>
</svg>
