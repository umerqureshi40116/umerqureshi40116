<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Umer Qureshi - Web, AI and Automation. Islamabad, Pakistan. Open to work.">
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc" stop-opacity=".10"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<linearGradient id="fx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".05" stop-color="#fff" stop-opacity="1"/><stop offset=".95" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="mx"><rect width="1200" height="340" fill="url(#fx)"/></mask>
<pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)"><path d="M56 0H0v56" fill="none" stroke="#6366f1" stroke-opacity=".075" stroke-width="1"/></pattern>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
<linearGradient id="at" x1="0" y1="0" x2="1" y2="0"><stop offset="0.0000" stop-color="#38bdf8"/><stop offset="0.0833" stop-color="#6366f1"/><stop offset="0.1667" stop-color="#a78bfa"/><stop offset="0.2500" stop-color="#6366f1"/><stop offset="0.3333" stop-color="#38bdf8"/><stop offset="0.4167" stop-color="#6366f1"/><stop offset="0.5000" stop-color="#a78bfa"/><stop offset="0.5833" stop-color="#6366f1"/><stop offset="0.6667" stop-color="#38bdf8"/><stop offset="0.7500" stop-color="#6366f1"/><stop offset="0.8333" stop-color="#a78bfa"/><stop offset="0.9167" stop-color="#6366f1"/><stop offset="1.0000" stop-color="#38bdf8"/></linearGradient><mask id="tm"><text class="sans" x="72" y="212" font-size="84" font-weight="800" letter-spacing="-2.5" fill="#fff">UMER QURESHI</text></mask><filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter></defs>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.pan{animation:pan 7s ease-in-out infinite alternate}
.sweep{animation:sweep 5.5s ease-in-out infinite}
.gA{animation:gA 15s ease-in-out infinite alternate}
.gB{animation:gB 19s ease-in-out infinite alternate}
.blink{animation:blink 2.4s ease-in-out infinite}
.oA{animation:spin 26s linear infinite;transform-box:fill-box;transform-origin:center}
.oB{animation:spin 17s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.oC{animation:spin 34s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes pan{from{transform:translateX(-300px)}to{transform:translateX(300px)}}
@keyframes sweep{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1500px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gA{from{transform:translate(0,0)}to{transform:translate(90px,26px)}}
@keyframes gB{from{transform:translate(0,0)}to{transform:translate(-70px,-20px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pan,.sweep,.gA,.gB,.blink,.oA,.oB,.oC{animation:none}}
</style>
<rect width="1200" height="340" fill="#05060c"/><g mask="url(#mx)"><rect width="1200" height="340" fill="url(#grid)"/></g><rect x="36" y="0" width="1" height="340" fill="#161b2f"/>
<g filter="url(#soft)" opacity=".42"><circle class="gA" cx="250" cy="150" r="115" fill="#38bdf8"/><circle class="gB" cx="1000" cy="210" r="125" fill="#a78bfa"/></g>
<g class="oA"><circle cx="1010" cy="170" r="44" fill="none" stroke="#38bdf8" stroke-opacity=".34" stroke-width="1.5" stroke-dasharray="50 32"/></g>
<g class="oB"><circle cx="1010" cy="170" r="66" fill="none" stroke="#6366f1" stroke-opacity=".42" stroke-width="1.5" stroke-dasharray="24 60"/></g>
<g class="oC"><circle cx="1010" cy="170" r="90" fill="none" stroke="#a78bfa" stroke-opacity=".26" stroke-width="1.5" stroke-dasharray="88 46"/></g>
<circle cx="1010" cy="170" r="4.5" fill="#38bdf8"/><circle cx="1010" cy="170" r="11" fill="#38bdf8" opacity=".16"/>
<circle class="blink" cx="76" cy="116" r="3.5" fill="#38bdf8"/>
<text class="mono" x="92" y="120" font-size="11.5" letter-spacing="2.4" fill="#7a8299">OPEN TO WORK</text>
<g mask="url(#tm)" filter="url(#bloom)" opacity=".5"><rect class="pan" x="-300" y="120" width="1800" height="140" fill="url(#at)"/></g>
<g mask="url(#tm)" ><rect class="pan" x="-300" y="120" width="1800" height="140" fill="url(#at)"/></g>
<text class="mono" x="74" y="254" font-size="15" letter-spacing="6" fill="#7a8299">WEB &#183; AI &amp; AUTOMATION</text>
<text class="sans" x="72" y="292" font-size="15" fill="#7a8299">Islamabad, Pakistan &#8212; available for freelance work and collaborations.</text>
<g mask="url(#mx)"><g class="sweep"><rect x="-340" y="-90" width="340" height="520" fill="url(#shim)" transform="skewX(-22)"/></g></g>
</svg>
